<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantalla de Turnos (HTML) · Sala de Espera | GanaGana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Socket.IO desde el servidor -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    /* ── Paleta Pastel Breeze ─────────────────────────────────────── */
    :root {
      --sky:       #A8D5E2;
      --sky-dark:  #7BBDD0;
      --mint:      #B5EAD7;
      --lavender:  #C9C0E8;
      --rose:      #FFB7C3;
      --peach:     #FFDAB9;
      --warm-white:#FFF8F0;
      --text-main: #2A2A3A;
      --text-soft: #5A5A6E;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(160deg, #d0edf8 0%, #e8f8f0 40%, #ede8f8 80%, var(--warm-white) 100%);
      color: var(--text-main);
      overflow: hidden;
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    .screen {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 1fr;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.125rem 2.5rem;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(0.75rem);
      border-bottom: 1px solid rgba(200,210,230,0.5);
    }

    .header-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .clock {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-soft);
      font-variant-numeric: tabular-nums;
    }

    .conn-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.3125rem 0.875rem;
      border-radius: 1.25rem;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .conn-badge.online  { background: #d4f5e9; color: #1a6644; }
    .conn-badge.offline { background: #fde8e8; color: #9b2222; }
    .conn-badge .dot {
      width: 0.5625rem; height: 0.5625rem; border-radius: 50%;
    }
    .conn-badge.online  .dot { background: #2ecc71; }
    .conn-badge.offline .dot { background: #e74c3c; animation: blink 1s infinite; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── Área central ────────────────────────────────────────────── */
    .main-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3.75rem;
      padding: 2rem 2.5rem;
    }

    /* ── Turno principal ────────────────────────────────────────── */
    .turno-principal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(0.75rem);
      border-radius: 1.75rem;
      box-shadow: 0 0.5rem 2.5rem rgba(100,100,150,0.15);
      padding: 3rem 4rem;
      min-width: 26.25rem;
    }

    .tp-label {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.1875rem;
      margin-bottom: 1rem;
    }

    .tp-num {
      font-size: 11rem;
      font-weight: 900;
      line-height: 1;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.25rem;
      transition: all 0.1s;
    }

    .tp-caja {
      margin-top: 1.25rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-soft);
      background: var(--sky);
      padding: 0.5rem 1.5rem;
      border-radius: 2.5rem;
    }

    /* ── Panel lateral (siguiente / después) ───────────────────── */
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      min-width: 15rem;
    }

    .next-card {
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(0.625rem);
      border-radius: 1.25rem;
      box-shadow: 0 0.25rem 1.25rem rgba(100,100,150,0.10);
      padding: 1.375rem 1.75rem;
      text-align: center;
    }

    .next-card .nc-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    .next-card .nc-num {
      font-size: 3.8rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
    }

    .next-card .nc-caja {
      font-size: 0.8rem;
      color: var(--text-soft);
      margin-top: 0.25rem;
    }

    .next-card.nc-after .nc-num {
      font-size: 2.8rem;
      color: var(--text-soft);
    }

    /* ── Animación de entrada ───────────────────────────────────── */
    @keyframes pop-in {
      0%   { opacity:0; transform: scale(0.6); }
      70%  { transform: scale(1.06); }
      100% { opacity:1; transform: scale(1); }
    }
    @keyframes slide-up {
      0%   { opacity:0; transform: translateY(1.875rem); }
      100% { opacity:1; transform: translateY(0); }
    }

    .anim-pop    { animation: pop-in  0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .anim-slide  { animation: slide-up 0.4s ease-out forwards; }

    /* ── Footer ─────────────────────────────────────────────────── */
    .footer {
      padding: 0.875rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(0.5rem);
      border-top: 1px solid rgba(200,210,230,0.4);
    }

    .footer-msg {
      font-size: 0.88rem;
      color: var(--text-soft);
      font-weight: 600;
    }

    .footer-brand {
      font-size: 0.82rem;
      color: #aaa;
    }

    /* ── Activación de audio ────────────────────────────────────── */
    .audio-overlay {
      position: fixed; inset: 0;
      background: rgba(30,20,60,0.7);
      backdrop-filter: blur(0.25rem);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .audio-box {
      background: white;
      border-radius: 1.5rem;
      padding: 3rem 3.5rem;
      text-align: center;
      box-shadow: 0 1.25rem 3.75rem rgba(0,0,0,0.3);
      max-width: 27.5rem;
    }
    .audio-box h2 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    .audio-box p  { color: var(--text-soft); margin-bottom: 1.75rem; font-size: 0.95rem; line-height:1.6; }
    .btn-activar {
      background: var(--sky);
      color: #1a4f5e;
      border: none;
      padding: 1rem 2.5rem;
      border-radius: 0.875rem;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-activar:hover  { background: var(--sky-dark); }
    .btn-activar:active { transform: scale(0.97); }

    /* ── Silencio badge ─────────────────────────────────────────── */
    .muted-badge {
      background: #fff0f0;
      color: #c0392b;
      padding: 0.25rem 0.75rem;
      border-radius: 0.75rem;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* ── Sin turno (estado inicial) ─────────────────────────────── */
    .no-turno .tp-num {
      font-size: 8rem;
      color: #ccc;
      letter-spacing: 0;
    }
    /* ══ AUTO-AJUSTE: llena cualquier dispositivo sin zoom manual ══ */
    html { font-size: clamp(16px, min(1.3vw, 2.2vh), 52px); }
    @media (max-width: 700px) { html { font-size: clamp(16px, 4.4vw, 21px); } }
    .screen { height: 100vh; height: 100dvh; }
    .header { padding: 1.6vh 3vw; }
    .header-title { font-size: clamp(1.3rem, 2.8vw, 3.4rem); }
    .clock { font-size: clamp(1.1rem, 2.4vw, 3rem); }
    .conn-badge { font-size: clamp(.75rem, 1.2vw, 1.4rem); }
    .main-area { min-height: 0; gap: 3vw; padding: 3vh 3vw; align-items: stretch; }
    .turno-principal { flex: 1 1 auto; min-width: 0; padding: 3vh 3vw; border-radius: clamp(1.25rem, 3vw, 3rem); }
    .tp-label { font-size: clamp(.9rem, min(2.2vw, 3.4vh), 2.6rem); margin-bottom: 2vh; }
    .tp-num { font-size: min(25vw, 50vh); letter-spacing: -0.02em; }
    .no-turno .tp-num { font-size: min(20vw, 40vh); }
    .tp-caja { margin-top: 3vh; padding: 1.4vh 3vw; font-size: clamp(1.1rem, min(4.2vw, 6.5vh), 5rem); }
    .side-panel { min-width: 0; flex: 0 0 22vw; justify-content: center; gap: 2.5vh; }
    .next-card { padding: 2.5vh 1.5vw; }
    .next-card .nc-label { font-size: clamp(.7rem, 1.3vw, 1.6rem); }
    .next-card .nc-num { font-size: min(8vw, 12vh); }
    .next-card.nc-after .nc-num { font-size: min(6vw, 9vh); }
    .next-card .nc-caja { font-size: clamp(.8rem, 1.4vw, 1.8rem); }
    .footer { padding: 1.4vh 3vw; }
    .footer-msg { font-size: clamp(.8rem, 1.4vw, 1.8rem); }
    .btn-probar { position: fixed; right: 0.75rem; bottom: 3.5rem; z-index: 20; background: #fff; border: 1px solid #cfd8e3;
      border-radius: 0.625rem; padding: 0.375rem 0.75rem; font-family: inherit; font-weight: 700; cursor: pointer; opacity: .75; }
    .btn-probar:hover { opacity: 1; background: #F8E704; }
    .sel-voz { right: 9.375rem; max-width: 16.25rem; }
    .llamada-flash { position: fixed; inset: 0; z-index: 900; pointer-events: none; opacity: 0;
      border: clamp(0.5rem, 1.2vw, 1.5rem) solid #F8E704; box-shadow: inset 0 0 clamp(2.5rem, 8vw, 10rem) rgba(248,231,4,.75); }
    .llamada-flash.on { animation: llamada-flash .7s ease-in-out 4; }
    @keyframes llamada-flash { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
    @media (max-aspect-ratio: 1/1) {
      .main-area { flex-direction: column; justify-content: center; padding: 2vh 4vw; }
      .turno-principal { width: 100%; padding: 2vh 4vw; }
      .tp-num { font-size: min(34vw, 30vh); }
      .tp-caja { font-size: clamp(1rem, min(6vw, 4.5vh), 3rem); padding: 1.2vh 5vw; }
      .side-panel { flex: 0 0 auto; flex-direction: row; width: 100%; gap: 3vw; }
      .next-card { flex: 1; padding: 1.5vh 2vw; }
      .next-card .nc-num { font-size: min(13vw, 8vh); }
      .next-card.nc-after .nc-num { font-size: min(11vw, 7vh); }
    }
  </style>
</head>
<body>

<!-- Overlay para activar audio (requerido por navegadores) -->
<div class="audio-overlay" id="audioOverlay">
  <div class="audio-box">
    <h2>🔔 Pantalla de Turnos</h2>
    <p>Haz clic en el botón para activar la pantalla y habilitar las notificaciones de sonido.</p>
    <button class="btn-activar" onclick="activarPantalla()">Activar pantalla</button>
  </div>
</div>

<div class="screen" id="screen" style="display:none">
  <!-- Header -->
  <header class="header">
    <div class="header-title" id="headerTitle">GanaGana</div>
    <div class="header-right">
      <div class="clock" id="clock">00:00:00</div>
      <div class="conn-badge offline" id="connBadge">
        <span class="dot"></span>
        <span id="connText">Conectando…</span>
      </div>
      <div class="muted-badge" id="mutedBadge" style="display:none">🔇 Silencio</div>
    </div>
  </header>

  <!-- Main -->
  <main class="main-area" id="mainArea">
    <div class="turno-principal no-turno" id="turnoCard">
      <div class="tp-label">TURNO EN ATENCIÓN</div>
      <div class="tp-num" id="tpNum">---</div>
      <div class="tp-caja" id="tpCaja" style="display:none">DIRÍJASE A LA CAJA —</div>
    </div>

    <div class="side-panel" id="sidePanel">
      <div class="next-card" id="ncSiguiente">
        <div class="nc-label">Siguiente</div>
        <div class="nc-num" id="ncSigNum">---</div>
        <div class="nc-caja" id="ncSigCaja"></div>
      </div>
      <div class="next-card nc-after" id="ncDespues">
        <div class="nc-label">Después</div>
        <div class="nc-num" id="ncDesNum">---</div>
        <div class="nc-caja" id="ncDesCaja"></div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-msg">🟢 Por favor espere a ser llamado</div>
    <div class="footer-brand" id="footerBrand">Sistema de Turnos</div>
  </footer>
</div>

<!-- Audio de notificación generado con Web Audio API -->
<audio id="audioEl" preload="auto"></audio>
<div id="llamadaFlash" class="llamada-flash" aria-hidden="true"></div>
<select id="selVoz" class="btn-probar sel-voz" aria-label="Elegir voz" onchange="cambiarVoz(this.value)" style="display:none"></select>
<button class="btn-probar" onclick="probarVoz()" title="Probar campanilla y voz">🔊 Probar voz</button>

<script>
// ── Configuración ──────────────────────────────────────────────────────────
let cfgVolumen  = 1;
let cfgSilencio = false;
let audioCtx    = null;
let audioReady  = false;

function activarPantalla() {
  document.getElementById('audioOverlay').style.display = 'none';
  document.getElementById('screen').style.display       = 'grid';

  // Crear AudioContext tras interacción del usuario
  audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
  audioReady = true;
  if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }

  iniciarSocket();
  iniciarReloj();
  llenarSelectorVoz();
  setTimeout(llenarSelectorVoz, 1500);
}

// ── Reloj ──────────────────────────────────────────────────────────────────
function iniciarReloj() {
  function tick() {
    const now = new Date();
    const hh  = String(now.getHours()).padStart(2,'0');
    const mm  = String(now.getMinutes()).padStart(2,'0');
    const ss  = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;
  }
  tick();
  setInterval(tick, 1000);
}

// ── Formato turno ──────────────────────────────────────────────────────────
function fmt(n) {
  if (n == null || n === '') return '---';
  const num = parseInt(n, 10);
  if (!Number.isFinite(num) || num < 0) return '---';
  const letra = String.fromCharCode(65 + (Math.floor(num / 100) % 26));
  return letra + String(num % 100).padStart(2, '0');
}

// ── Voz de llamado (SpeechSynthesis, español) ──────────────────────────────
const NOMBRE_LETRA = { A:'a',B:'be',C:'ce',D:'de',E:'e',F:'efe',G:'ge',H:'hache',I:'i',J:'jota',K:'ka',L:'ele',M:'eme',N:'ene',O:'o',P:'pe',Q:'cu',R:'erre',S:'ese',T:'te',U:'u',V:'uve',W:'uve doble',X:'equis',Y:'ye',Z:'zeta' };
const PALABRA_LETRA = { A:'Ana',B:'Bogotá',C:'Cali',D:'Diana',E:'Elena',F:'Fernando',G:'Gloria',H:'Hugo',I:'Isabel',J:'Juan',K:'Kilo',L:'Luis',M:'María',N:'Nancy',O:'Óscar',P:'Pedro',Q:'Quito',R:'Rosa',S:'Sandra',T:'Tolima',U:'Uruguay',V:'Valentina',W:'Washington',X:'Xilófono',Y:'Yolanda',Z:'Zapato' };
const UNIDADES  = ['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];
const ESPECIALES= ['diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve'];
const VEINTES   = ['veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const DECENAS   = ['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
function numeroEnPalabras(n) {
  if (n < 10) return 'cero ' + UNIDADES[n];
  if (n < 20) return ESPECIALES[n - 10];
  if (n < 30) return VEINTES[n - 20];
  const d = Math.floor(n / 10), u = n % 10;
  return u === 0 ? DECENAS[d] : DECENAS[d] + ' y ' + UNIDADES[u];
}
function partesVoz(turno, caja) {
  const num = parseInt(turno, 10);
  const letra = String.fromCharCode(65 + (Math.floor(num / 100) % 26));
  const resto = num % 100;
  const numTxt = resto === 0 ? 'cero cero' : numeroEnPalabras(resto);
  const digitos = UNIDADES[Math.floor(resto / 10)] + ', ' + UNIDADES[resto % 10];
  return [
    'Atención. Turno, letra ' + NOMBRE_LETRA[letra] + ', de ' + PALABRA_LETRA[letra] + '.',
    'Número ' + numTxt + '. ' + digitos + '.',
    'Diríjase a la caja número ' + (UNIDADES[Number(caja)] !== undefined ? UNIDADES[Number(caja)] : caja) + '.'
  ];
}
function textoVoz(turno, caja) { return partesVoz(turno, caja).join(' '); }
let vozES = null;
function puntajeVoz(v) {
  const lang = (v.lang || '').toLowerCase().replace('_', '-');
  let p = 0;
  if (/natural|neural|online/i.test(v.name)) p += 100;
  if (/google/i.test(v.name)) p += 40;
  p += ({ 'es-co': 30, 'es-mx': 25, 'es-us': 20, 'es-es': 10 })[lang] || 0;
  if (/salome|dalia|elvira|paloma|sabina|helena|laura|jorge|alonso/i.test(v.name)) p += 8;
  return p;
}
function listarVoces() {
  if (!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(x => (x.lang || '').toLowerCase().startsWith('es'))
    .sort((a, b) => puntajeVoz(b) - puntajeVoz(a));
}
function elegirVoz() {
  const v = listarVoces();
  const guardada = localStorage.getItem('gg_voz');
  return v.find(x => x.name === guardada) || v[0] || null;
}
function llenarSelectorVoz() {
  const sel = document.getElementById('selVoz');
  if (!sel) return;
  const voces = listarVoces();
  const actual = localStorage.getItem('gg_voz') || '';
  sel.innerHTML = '<option value="">Voz automática (la más clara)</option>' +
    voces.map(v => '<option value="' + v.name + '"' + (v.name === actual ? ' selected' : '') + '>' + v.name + '</option>').join('');
  sel.style.display = voces.length ? '' : 'none';
}
function cambiarVoz(nombre) {
  if (nombre) localStorage.setItem('gg_voz', nombre); else localStorage.removeItem('gg_voz');
  vozES = elegirVoz();
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { vozES = elegirVoz(); llenarSelectorVoz(); };

// Habla despacio, en frases con pausa, y repite dos veces. Siempre intenta hablar.
function hablarRonda(partes, alTerminar) {
  partes.forEach((txt, i) => {
    const u = new SpeechSynthesisUtterance(txt);
    if (vozES) { u.voice = vozES; u.lang = vozES.lang; } else { u.lang = 'es-CO'; }
    u.volume = Math.max(0.4, Math.min(1, cfgVolumen));
    u.rate = 0.8; u.pitch = 0.95;
    u.onerror = e => console.warn('Voz:', e.error);
    if (i === partes.length - 1 && alTerminar) u.onend = alTerminar;
    speechSynthesis.speak(u);
  });
}
function hablarTurno(turno, caja) {
  if (!('speechSynthesis' in window)) return false;
  vozES = vozES || elegirVoz();
  if (speechSynthesis.paused) speechSynthesis.resume();
  const partes = partesVoz(turno, caja);
  let restantes = 2;
  const ronda = () => { restantes -= 1; hablarRonda(partes, restantes > 0 ? () => setTimeout(ronda, 1200) : null); };
  ronda();
  return true;
}
// Campanilla + voz + aviso visual
function anunciar(turno, caja) {
  if (cfgSilencio) return;
  const fl = document.getElementById('llamadaFlash');
  if (fl) { fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on'); }
  playDing();
  setTimeout(() => hablarTurno(turno, caja), 1000);
}
function probarVoz() { anunciar(22, 2); }
// ── Sonido con Web Audio API ───────────────────────────────────────────────
// Campanilla fuerte: 3 notas x2, onda triangular, ganancia amplificada + compresor
function playDing() {
  if (!audioReady || cfgSilencio || !audioCtx) return;
  const vol = Math.max(0, Math.min(1, cfgVolumen));
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const t0 = audioCtx.currentTime;

  const master = audioCtx.createGain();
  master.gain.value = vol * 3.2;
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 6;
  comp.attack.value = 0.003;  comp.release.value = 0.2;
  master.connect(comp); comp.connect(audioCtx.destination);

  [0].forEach(rep => {
    [880, 1100, 1320].forEach((freq, i) => {
      const ini = t0 + rep + i * 0.22;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, ini);
      g.gain.exponentialRampToValueAtTime(0.9, ini + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, ini + 0.7);
      g.connect(master);
      [['triangle', freq], ['sine', freq * 2]].forEach(([tipo, f]) => {
        const o = audioCtx.createOscillator();
        o.type = tipo; o.frequency.value = f;
        o.connect(g); o.start(ini); o.stop(ini + 0.75);
      });
    });
  });
}
// ── Actualizar pantalla ────────────────────────────────────────────────────
let ultimoTurnoMostrado = null;

function actualizarPantalla(estado) {
  const ultimos = estado.ultimos || []; // [{ turno, caja }, ...]

  const actual    = ultimos[0] || null;
  const siguiente = ultimos[1] || null;
  const despues   = ultimos[2] || null;

  // Turno principal
  const tpNum  = document.getElementById('tpNum');
  const tpCaja = document.getElementById('tpCaja');
  const card   = document.getElementById('turnoCard');

  if (actual) {
    const numFmt = fmt(actual.turno);

    if (ultimoTurnoMostrado !== actual.turno) {
      ultimoTurnoMostrado = actual.turno;

      // Animación
      tpNum.classList.remove('anim-pop');
      void tpNum.offsetWidth; // reflow
      tpNum.classList.add('anim-pop');

      card.classList.remove('no-turno');
      tpNum.textContent  = numFmt;
      tpCaja.textContent = `DIRÍJASE A LA CAJA ${actual.caja}`;
      tpCaja.style.display = '';

      // Actualizar color de caja
      const cajaColores = { 1: '#A8D5E2', 2: '#B5EAD7', 3: '#C9C0E8', 4: '#FFDAB9' };
      tpCaja.style.background = cajaColores[actual.caja] || '#A8D5E2';

      // Campanilla + voz
      anunciar(actual.turno, actual.caja);
    }
  } else {
    tpNum.textContent = '---';
    tpCaja.style.display = 'none';
    card.classList.add('no-turno');
  }

  // Siguiente
  const ncSigNum  = document.getElementById('ncSigNum');
  const ncSigCaja = document.getElementById('ncSigCaja');
  if (siguiente) {
    ncSigNum.textContent  = fmt(siguiente.turno);
    ncSigCaja.textContent = `Caja ${siguiente.caja}`;
  } else {
    ncSigNum.textContent  = '---';
    ncSigCaja.textContent = '';
  }

  // Después
  const ncDesNum  = document.getElementById('ncDesNum');
  const ncDesCaja = document.getElementById('ncDesCaja');
  if (despues) {
    ncDesNum.textContent  = fmt(despues.turno);
    ncDesCaja.textContent = `Caja ${despues.caja}`;
  } else {
    ncDesNum.textContent  = '---';
    ncDesCaja.textContent = '';
  }
}

// ── Socket.IO ──────────────────────────────────────────────────────────────
function iniciarSocket() {
  const socket = io({ transports: ['websocket', 'polling'] });
  const badge  = document.getElementById('connBadge');
  const btext  = document.getElementById('connText');

  socket.on('connect', () => {
    badge.className = 'conn-badge online';
    btext.textContent = 'Conectado';
  });

  socket.on('disconnect', () => {
    badge.className = 'conn-badge offline';
    btext.textContent = 'Sin conexión';
  });

  socket.on('estado_actualizado', (data) => {
    actualizarPantalla(data);
  });

  socket.on('nuevo_turno', (data) => {
    if (data.estado) actualizarPantalla(data.estado);
  });

  socket.on('config_actualizada', (cfg) => {
    if (cfg.establecimiento) {
      document.getElementById('headerTitle').textContent = cfg.establecimiento;
      document.getElementById('footerBrand').textContent = cfg.establecimiento;
    }
    if (cfg.volumen  !== undefined) cfgVolumen  = cfg.volumen;
    if (cfg.silencio !== undefined) {
      cfgSilencio = cfg.silencio;
      document.getElementById('mutedBadge').style.display = cfgSilencio ? '' : 'none';
    }
  });
}
