services:
  - type: web
    name: turnos-ganagana
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ_TURNERO
        value: America/Bogota          # el reinicio diario a A00 usa la hora de Colombia
      - key: SESSION_SECRET
        generateValue: true
      # ── Base de datos permanente (Supabase) ────────────────────────────────
      # Sin esto, cada reinicio de Render borra turnos, contador y administradores.
      # Supabase → Connect → Transaction pooler → URI (postgresql://...)
      - key: DATABASE_URL
        sync: false
      # ── Completar en el panel de Render (sync: false = no se guarda en el repo) ──
      - key: PUBLIC_URL
        sync: false
      - key: HCAPTCHA_SITEKEY
        sync: false
      - key: HCAPTCHA_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ADMIN_PRINCIPAL_PASSWORD
        sync: false
    healthCheckPath: /api/salud
